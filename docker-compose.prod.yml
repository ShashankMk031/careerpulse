version: '3.8'

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: cp-prod-postgres
    environment:
      - POSTGRES_DB=serving_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cp_prod_postgres_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serving_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp-prod-backend
    environment:
      - DB_ENVIRONMENT=RDS
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=serving_db
      - DB_USER=postgres
      - DB_PASSWORD=cp_prod_postgres_password
      - APP_ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cp-prod-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_prod_data:
