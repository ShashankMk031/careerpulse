name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Continuous Integration & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: serving_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cp_local_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn psycopg2-binary python-dotenv boto3 pyarrow pytest requests httpx

      - name: Run Backend Tests
        env:
          DB_ENVIRONMENT: RDS
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: serving_db
          DB_USER: postgres
          DB_PASSWORD: cp_local_postgres_password
          APP_ENV: testing
        run: |
          python -m unittest discover tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test

      - name: Run TypeScript Compile Checking
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build React Production Assets
        working-directory: frontend
        run: npm run build

      - name: Build Production Docker Images
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Start Production Containers Stack
        run: |
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for Containers to Initialise
        run: sleep 10

      - name: Check Container Healths & Logs
        run: |
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs

      - name: Smoke Test Health Endpoint
        run: |
          curl -f --retry 5 --retry-delay 3 http://localhost/health

      - name: Smoke Test API Summary Endpoint
        run: |
          curl -f --retry 5 --retry-delay 3 http://localhost/api/v1/summary

      - name: Tear Down Container Stack
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v

      - name: Upload Frontend Production Assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
