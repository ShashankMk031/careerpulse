version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cp-local-postgres
    environment:
      - POSTGRES_DB=serving_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cp_local_postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serving_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cp-local-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@careerpulse.dev
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
