version: '3.8'

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: cp-local-postgres
    environment:
      - POSTGRES_DB=serving_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cp_local_postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serving_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp-local-backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DB_ENVIRONMENT=RDS
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=serving_db
      - DB_USER=postgres
      - DB_PASSWORD=cp_local_postgres_password
      - APP_ENV=development
      - LOG_LEVEL=debug
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cp-local-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: cp-local-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@careerpulse.dev
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
